<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>Segment to Focus</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <meta
      name="description"
      content="Segment to Focus is coming soon."
    >

    <style>
      :root {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
        background: #f9fafb;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
      }

      main {
        max-width: 720px;
        padding: 3rem 1.5rem;
        text-align: center;
      }

      .badge {
        display: inline-block;
        margin-bottom: 1rem;
        padding: 0.35rem 0.7rem;
        border: 1px solid #d1d5db;
        border-radius: 999px;
        font-size: 0.85rem;
        color: #4b5563;
        background: #ffffff;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.5rem, 8vw, 5rem);
        line-height: 1;
        letter-spacing: -0.06em;
      }

      p {
        margin: 1.25rem auto 0;
        max-width: 560px;
        font-size: 1.15rem;
        line-height: 1.6;
        color: #4b5563;
      }

      footer {
        margin-top: 2.5rem;
        font-size: 0.9rem;
        color: #6b7280;
      }
    </style>
  </head>

  <body>
    <main>
      <span class="badge">Coming soon</span>

      <h1>Segment to Focus</h1>

      <p>
        A small placeholder site for the segment-to-focus project.
        More details will be added here soon.
      </p>

      <footer>
        segment-to-focus.github.io
      </footer>
    </main>
  </body>
</html>
